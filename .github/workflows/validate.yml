name: Validate foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore FinanceOS.slnx --locked-mode
      - name: Build including WPF
        run: dotnet build FinanceOS.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test tests/FinanceOS.Tests -c Release --no-build --no-restore
      - name: Formatting and analyzers
        run: dotnet format FinanceOS.slnx --verify-no-changes --no-restore
      - name: Development desktop smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -ExecutablePath ./src/FinanceOS.Desktop/bin/Release/net10.0-windows10.0.19041.0/FinanceOS.exe
      - name: Publish Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Windows desktop smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Windows toast API smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/win-x64/FinanceOS.exe -ArgumentList '--toast-smoke' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Toast smoke timed out.' }
          Get-Content "$env:TEMP/finance-toast-smoke.txt"
          if ($process.ExitCode -ne 0) { throw "Toast smoke failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: finance-os-win-x64-unverified-release
          path: artifacts/win-x64/
